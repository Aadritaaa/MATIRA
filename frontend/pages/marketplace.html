<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MATIRA Marketplace</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/marketplace.css">
</head>
<body>
  <div class="mp-container">
    <h1>MATIRA Marketplace</h1>
    <p><a href="index.html">Home</a> | <a href="buyer-dashboard.html">My Requests</a> | <a href="login.html">Login</a></p>

    <form id="filterForm" class="mp-filters">
      <input id="search" placeholder="Search products">
      <select id="category"><option value="">All categories</option></select>
      <input id="location" placeholder="Location">
      <input id="minPrice" type="number" placeholder="Min price">
      <input id="maxPrice" type="number" placeholder="Max price">
      <select id="sort">
        <option value="newest">Newest</option>
        <option value="price_asc">Price: low to high</option>
        <option value="price_desc">Price: high to low</option>
      </select>
      <button class="mp-btn" type="submit">Filter</button>
    </form>

    <div id="productGrid" class="mp-grid">Loading...</div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/buyer.js"></script>
</body>
</html>
