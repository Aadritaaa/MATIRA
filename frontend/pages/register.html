<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — MATIRA B2B Agricultural Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/pages/index.html" class="nav-brand">
            <span class="logo-icon">🌾</span>
            <div>
                <span data-i18n="brand.title">MATIRA</span>
                <span class="subtext" data-i18n="brand.subtitle">Direct B2B Agricultural Marketplace</span>
            </div>
        </a>
        <div style="display: flex; align-items: center; gap: 14px;">
            <div id="navLangContainer"></div>
            <div class="nav-links">
                <a href="/pages/index.html" data-i18n="nav.home">Home</a>
                <a href="/pages/login.html" class="btn btn-secondary btn-sm" data-i18n="nav.signin">Sign In</a>
            </div>
        </div>
    </nav>

    <!-- Registration Container -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-brand-badge">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M12 8v4"/>
                        <path d="M12 16h.01"/>
                    </svg>
                </div>
                <h1 data-i18n="auth.register_title">Create MATIRA Account</h1>
                <p data-i18n="auth.register_subtitle">Register as a Farmer/Seller or a Local Business Buyer</p>
            </div>

            <!-- Error alert -->
            <div id="registerError" class="alert alert-danger" style="display: none;"></div>

            <form id="registerForm">
                <!-- Role Selection -->
                <label data-i18n="auth.role_prompt">I want to register as:</label>
                <div class="role-selector">
                    <div class="role-option">
                        <input type="radio" id="roleFarmer" name="role" value="farmer" checked>
                        <label for="roleFarmer" class="role-card">
                            <span class="role-icon">🧑‍🌾</span>
                            <span class="role-title" data-i18n="auth.role_farmer">Farmer / Seller</span>
                            <span class="role-desc" data-i18n="auth.role_farmer_desc">Sell bulk harvest</span>
                        </label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="roleBuyer" name="role" value="buyer">
                        <label for="roleBuyer" class="role-card">
                            <span class="role-icon">🏪</span>
                            <span class="role-title" data-i18n="auth.role_buyer">Business Buyer</span>
                            <span class="role-desc" data-i18n="auth.role_buyer_desc">Source farm produce</span>
                        </label>
                    </div>
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="full_name" data-i18n="auth.fullname">Full Name / Cooperative Name *</label>
                    <input type="text" id="full_name" placeholder="e.g. Md. Abdul Karim" data-i18n-placeholder="auth.fullname_placeholder" required>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phone" data-i18n="auth.phone">Mobile Phone Number *</label>
                    <input type="tel" id="phone" placeholder="e.g. 01711000000" data-i18n-placeholder="auth.phone_placeholder" required>
                </div>

                <!-- Email (Optional) -->
                <div class="form-group">
                    <label for="email" data-i18n="auth.email">Email Address (Optional)</label>
                    <input type="email" id="email" placeholder="e.g. abdul@example.com">
                </div>

                <!-- District / Location (All 64 Districts) -->
                <div class="form-group">
                    <label for="district" data-i18n="auth.district">District / Region *</label>
                    <select id="district" required>
                        <option value="">-- Select District --</option>
                    </select>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password" data-i18n="auth.password">Password * (Min. 6 characters)</label>
                    <input type="password" id="password" placeholder="Create a secure password" minlength="6" required>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm_password" data-i18n="auth.confirm_password">Confirm Password *</label>
                    <input type="password" id="confirm_password" placeholder="Re-enter your password" data-i18n-placeholder="auth.confirm_password_placeholder" minlength="6" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.create_btn">Create Account</button>
            </form>

            <div class="auth-footer">
                <span data-i18n="auth.have_account">Already have an account?</span> 
                <a href="/pages/login.html" data-i18n="auth.signin_link">Sign In here</a>
            </div>

            <!-- Language preference switcher in card footer -->
            <div style="margin-top: 14px; text-align: center;" id="langSelectorContainer"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 MATIRA Project — CSE 3200 Software Development Project II</p>
    </footer>

    <script src="/js/districts.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
