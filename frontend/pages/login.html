<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MATIRA B2B Agricultural Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/pages/index.html" class="nav-brand">
            <span class="logo-icon">🌾</span>
            <div>
                MATIRA
                <span class="subtext">B2B Agricultural Marketplace</span>
            </div>
        </a>
        <div class="nav-links">
            <a href="/pages/index.html">Home</a>
            <a href="/pages/register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-badge">🔑</div>
                <h1>Sign In to MATIRA</h1>
                <p>Enter your phone number or email to access your account</p>
            </div>

            <!-- Error alert -->
            <div id="loginError" class="alert alert-danger" style="display: none;"></div>

            <form id="loginForm">
                <!-- Identifier (Phone or Email) -->
                <div class="form-group">
                    <label for="identifier">Phone Number or Email *</label>
                    <input type="text" id="identifier" placeholder="e.g. 01711000000 or email@domain.com" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account yet? <a href="/pages/register.html">Register as Farmer / Buyer</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 MATIRA Project — CSE 3200 Software Development Project II</p>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
